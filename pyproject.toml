[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-ng"
version = "4.13.0dev"
description = "galaxy-ng plugin for the Pulp Project"
readme = {text = "galaxy-ng plugin for the Pulp Project", content-type = "text/plain"}
license = {text = "GPLv2+"}
authors = [{name = "Red Hat, Inc.", email = "info@ansible.com"}]
urls = {Homepage = "https://github.com/ansible/galaxy_ng/"}
requires-python = ">=3.12"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Framework :: Django",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "galaxy-importer>=0.4.31,<0.5.0",
  "pulpcore>=3.105.23,<3.106",
  "pulp_ansible>=0.30.3,<0.31",
  "pulp-container>=2.27.11,<2.28",
  "pyjwt[crypto]>=2.14.0",
  "django>=5.2.17,<5.3",
  "django-prometheus>=2.0.0",
  "social-auth-core>=4.4.2",
  "social-auth-app-django>=5.2.0",
  "django-auth-ldap==4.0.0",
  "drf-spectacular",
  "dynaconf>=3.2.13",
  "insights_analytics_collector>=0.3.0",
  "boto3",
  "distro",
  "django-flags>=5.0.13",
  "django-ansible-base[jwt-consumer,feature-flags] @ git+https://github.com/ansible/django-ansible-base@ef2ceb250322272451ce220d10c20947898d36d3",
  "django-crum==0.7.9",
  "django-automated-logging~=6.2",
  "django-storages[azure,boto3,s3]",
  "aiohttp>=3.14.3",
  "aiodns>=3.3.0,<3.7",
  "pillow>=13.0.0",
  "cryptography>=46.0.7",
  "pyopenssl>=25.3.0",
  "black>=26.3.1",
  "ansible-lint>=26.1.1",
  "pyasn1>=0.6.4",
  "djangorestframework<3.16",
  "gitpython>=3.2.0",
]

[project.optional-dependencies]
insights = [
  "boto3",
  "logstash-formatter",
  "watchtower",
  "app-common-python",
]
standalone = []

[dependency-groups]
dev = [
  "coverage",
  "flake8",
  "flake8-black",
  "flake8-docstrings",
  "flake8-tuple",
  "flake8-quotes",
  "check-manifest",
  "darker",
  "isort",
  "pip-tools",
]

[project.entry-points."pulpcore.plugin"]
galaxy_ng = "galaxy_ng:default_app_config"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["galaxy_ng*"]
exclude = ["galaxy_ng.tests", "galaxy_ng.tests.*"]

[tool.black]
line-length = 100
target-version = ["py36", "py37"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | _build
  | build
  | dist
  | migrations
  | galaxy_ng/app/utils/apispec
)/
'''


[tool.darker]
src = [
    "galaxy_ng",
]
revision = "origin/main..."
isort = true
log_level = "INFO"
line_length = 100


[tool.check-manifest]
ignore = [
    ".gitleaks.toml",
    ".bumpversion.cfg",
    "CHANGES/**",
    "CONTRIBUTING.rst",
    "HISTORY.rst",
    "doc_requirements.txt",
    "functest_requirements.txt",
    "unittest_requirements.txt",
    "requirements/**",
    "docs/**",
    "galaxy_ng/tests/assets/**",
    "template_config.yml",
    ".travis/**",
    ".travis.yml",
    ".pep8speaks.yml",
    ".ci/**",
    ".github/**",
    "dev/**",
    "docker/**",
    "openshift/**",
    "galaxy_ng/app/static/**",
    ".compose.env.example",
    ".dockerignore",
    "COMMITMENT",
    "Dockerfile",
    "Makefile",
    "ROADMAP.rst",
    "ansible.cfg",
    "compose",
    "pr_check.sh",
    "lint_requirements.txt",
    "profiles/**",
]

[tool.coverage.run]
relative_files = true
data_file = "/tmp/.coverage"
omit = [
	"galaxy_ng/_vendor/*",
	"galaxy_ng/tests/*",
	"galaxy_ng/app/utils/apispec/*",
]

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "galaxy_ng/_vendor/",
    "galaxy_ng/app/utils/apispec/",
]

[tool.ruff.lint]
select = [
    # pyflakes
    "F",
    # pycodestyle errors
    "E",
    # pycodestyle warnings
    "W",
    # flake8-builtins
    "A",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-commas
    "COM",
    # flake8-datetime
    "DTZ",
    # flake8-import-conventions
    "ICN",
    # flake8-executable
    "EXE",
    # flake8-no-pep420
    "INP",
    # flake8-gettext
    "INT",
    # flake8-logging
    "LOG",
    # pyupgrade
    "UP",
    # flake8-pie
    "PIE",
    # flake8-pytest-style
    "PT",
    # flake8-pyi
    "PYI",
    # ruff specific rules
    "RUF",
    # flake8-simplify
    "SIM",
    # flake8-debugger
    "T10",
    # flake8-todos
    "TD"
]
extend-ignore = [
    # B904 requires using `raise ... from ...` to explicitly tell what to do with "parent"
    # exception. Would be nice to fix, but ignoring for now.
    "B904",
    # COM812 Trailing comma missing
    # Too many changes to enforce
    "COM812",
    # UP032 Use f-string instead of `format` call.
    # No need to replace all str.format usage with f-strings in entire codebase.
    "UP032",
    # PT009 Use a regular `assert` instead of unittest-style
    # Ignoring, since we have mixed pytest and legacy unittest styled tests
    "PT009",
    # RUF012 Mutable class attributes should be annotated with `typing.ClassVar`
    # We don't enforce type annotations at the moment.
    "RUF012",
    # RUF100 Unused `noqa` directive
    # False positives on rules not enabled in ruff, but enabled in flake8.
    "RUF100",
    # SIM108 Use ternary operator instead of `if`-`else`-block
    # Opinionated, ternary operators may reduce readability.
    "SIM108",
    # TD001 Invalid TODO tag
    # We use TODO, FIXME and REVIEW tags
    "TD001",
    # TD003 Missing issue link on the line following this TODO
    # We don't create issues for TODOs
    "TD003",
    # Ignored because it was removed at Ruff 0.13
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
# The `galaxy_ng` is the only top-level package. No other directory contains python packages.
"!galaxy_ng/**" = ["INP", "EXE"]
# Ignore "E501 Line too long" in migrations, since most of the warnings
# are due to autogenerated code.
"galaxy_ng/app/migrations/*" = ["E501"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.bumpversion]

current_version = "4.13.0dev"
commit = false
tag = false
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)((?P<release>[a-z]+))?((?P<build>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}{release}{build}",
  "{major}.{minor}.{patch}{release}",
  "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]

optional_value = "stable"
first_value = "dev"
values = [
  "dev",
  "a",
  "b",
  "stable"
]

[tool.bumpversion.parts.build]

first_value = 0

[[tool.bumpversion.files]]

filename = "./galaxy_ng/app/__init__.py"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]

filename = "./galaxy_ng/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]

filename = "./pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
